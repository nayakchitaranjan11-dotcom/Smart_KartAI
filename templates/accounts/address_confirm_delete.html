{% extends 'base.html' %}

{% block title %}Delete Address - SmartKart AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 text-center">
                <i class="bi bi-trash text-danger display-4 mb-3"></i>
                <h4 class="fw-bold mb-2">Delete Address?</h4>
                <p class="text-muted small mb-4">
                    Are you sure you want to remove <b>{{ address.full_name }}</b>'s address ({{ address.street_address|truncatewords:6 }}, {{ address.city }})?
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'accounts:address_list' %}" class="btn btn-light px-4 rounded-pill">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 rounded-pill fw-bold">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
