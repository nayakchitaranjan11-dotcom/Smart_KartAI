{% extends 'base.html' %}

{% block title %}{{ action }} - SmartKart AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-box-seam text-success me-2"></i>{{ action }}</h4>
                    <a href="{% url 'dashboard:products_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        &larr; Back to Products
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row g-3">
                        
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Product Title <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Category <span class="text-danger">*</span></label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Brand <small class="text-muted">(Optional)</small></label>
                            <select name="brand" class="form-select">
                                <option value="">No Brand / Generic</option>
                                {% for b in brands %}
                                <option value="{{ b.id }}" {% if product.brand_id == b.id %}selected{% endif %}>{{ b.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Description <span class="text-danger">*</span></label>
                            <textarea name="description" class="form-control" rows="3" required>{{ product.description|default:'' }}</textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">MRP / Original Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="original_price" class="form-control" value="{{ product.original_price|default:'0.00' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Selling Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ product.selling_price|default:'0.00' }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Pack Display Unit <span class="text-danger">*</span></label>
                            <input type="text" name="unit" class="form-control" placeholder="e.g. 1 kg, 500 g, 1 L, 1 Pack" value="{{ product.unit|default:'1 kg' }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Unit Metric Value <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="unit_value" class="form-control" value="{{ product.unit_value|default:'1.00' }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Unit Type</label>
                            <input type="text" name="unit_type" class="form-control" placeholder="kg, g, l, ml, pack" value="{{ product.unit_type|default:'kg' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Stock Quantity (Units) <span class="text-danger">*</span></label>
                            <input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity|default:'50' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Low Stock Reorder Level</label>
                            <input type="number" name="reorder_level" class="form-control" value="{{ product.reorder_level|default:'10' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Expiry Date (for Perishables)</label>
                            <input type="date" name="expiry_date" class="form-control" value="{{ product.expiry_date|date:'Y-m-d'|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Nutritional / Diet Tags</label>
                            <input type="text" name="nutritional_tags" class="form-control" placeholder="Organic, Gluten Free, High Protein" value="{{ product.nutritional_tags|default:'' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Product Image</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            {% if product.image %}
                            <div class="mt-2 small text-muted">Current: <a href="{{ product.image.url }}" target="_blank">{{ product.image.name }}</a></div>
                            {% endif %}
                        </div>

                        <div class="col-md-6">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" name="is_featured" id="featCheck" {% if product.is_featured %}checked{% endif %}>
                                <label class="form-check-label small fw-semibold" for="featCheck">
                                    Feature on Homepage Carousel
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" name="is_active" id="actCheck" {% if product.is_active|default:True %}checked{% endif %}>
                                <label class="form-check-label small fw-semibold" for="actCheck">
                                    Active for Customer Purchase
                                </label>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                        <a href="{% url 'dashboard:products_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-sk-primary rounded-pill px-5 fw-bold">Save Product</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
