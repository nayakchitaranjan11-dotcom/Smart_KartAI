{% extends 'base.html' %}

{% block title %}Edit Category - SmartKart AI{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square text-success me-2"></i>Edit Category</h3>
            <p class="text-muted small mb-0">Rename the aisle, change its icon, order or visibility</p>
        </div>
        <a href="{% url 'dashboard:categories_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">&larr; All Categories</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4 p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Category Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-8">
                    <label class="form-label small fw-semibold">Bootstrap Icon Class</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi {{ category.icon_class }}" id="iconPreview"></i></span>
                        <input type="text" name="icon_class" class="form-control" value="{{ category.icon_class }}"
                               oninput="document.getElementById('iconPreview').className = 'bi ' + this.value;">
                    </div>
                    <div class="form-text">Browse names at icons.getbootstrap.com (e.g. bi-egg-fried, bi-cup-straw)</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Display Order</label>
                    <input type="number" min="0" name="display_order" class="form-control" value="{{ category.display_order }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ category.description }}</textarea>
            </div>
            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="isActive" name="is_active" {% if category.is_active %}checked{% endif %}>
                <label class="form-check-label small" for="isActive">Visible to customers (active)</label>
            </div>
            <button type="submit" class="btn btn-sk-primary rounded-pill px-4 fw-bold">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
