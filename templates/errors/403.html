{% extends 'base.html' %}
{% block title %}403 Forbidden - SmartKart AI{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-lock"></i> 403</div>
    <h2 class="fw-bold mt-3">Access Restricted</h2>
    <p class="text-muted lead max-w-md mx-auto">
        You do not have permission to view this resource. Please make sure you are logged in with the appropriate role.
    </p>
    <div class="mt-4">
        <a href="{% url 'core:home' %}" class="btn btn-sk-primary px-4 py-2 me-2">Return Home</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-dark px-4 py-2">Switch Account</a>
    </div>
</div>
{% endblock %}
