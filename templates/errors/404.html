{% extends 'base.html' %}
{% block title %}404 Page Not Found - SmartKart AI{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="display-1 text-success fw-bold"><i class="bi bi-cart-x"></i> 404</div>
    <h2 class="fw-bold mt-3">Aisle Not Found</h2>
    <p class="text-muted lead max-w-md mx-auto">
        The grocery item, recipe, or page you are looking for has moved or does not exist.
    </p>
    <div class="mt-4">
        <a href="{% url 'core:home' %}" class="btn btn-sk-primary px-4 py-2 me-2">Back to Store</a>
        <a href="{% url 'catalogue:product_list' %}" class="btn btn-outline-dark px-4 py-2">Browse Catalogue</a>
    </div>
</div>
{% endblock %}
